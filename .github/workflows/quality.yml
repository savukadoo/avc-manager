name: Local security and quality gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android-and-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          python -m pip install semgrep==1.136.0
      - name: Verify without production signing material
        env:
          CC3_BUILD_MODE: debug
          SEMGREP_SETTINGS_FILE: /tmp/cc3-semgrep-settings.yml
          XDG_CACHE_HOME: /tmp/cc3-cache
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/verify.sh
      - name: Native parser sanitizers
        run: |
          clang -O1 -g -DNO_DEBUG -D_LITTLE_ENDIAN -fsanitize=address,undefined -fno-omit-frame-pointer -I third_party/zdtun tests/native/packet-parser-smoke.c third_party/zdtun/zdtun.c third_party/zdtun/utils.c -o /tmp/cc3-parser-check
          /tmp/cc3-parser-check
